[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-aware-ai-trading"
version = "0.1.0"
description = "Regime-aware quantitative trading system with HMM market states and a Dynamic Mixture-of-Experts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "pl1201" },
]
keywords = [
    "algorithmic-trading",
    "machine-learning",
    "mixture-of-experts",
    "hidden-markov-model",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "joblib>=1.4.0",
    "ccxt>=4.0.0",
    "python-binance>=1.0.20",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
ml = [
    "hmmlearn>=0.2.7",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "imbalanced-learn>=0.11.0",
    "optuna>=3.0.0",
]
ui = [
    "streamlit>=1.35.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-telegram-bot>=20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
trading-bot = "algo_trading.live.universal_bot:main"
trading-research = "algo_trading.cli.main:main"

[project.urls]
Homepage = "https://github.com/pl1201/regime-aware-ai-trading"
Repository = "https://github.com/pl1201/regime-aware-ai-trading"
Issues = "https://github.com/pl1201/regime-aware-ai-trading/issues"

[tool.setuptools.packages.find]
include = ["algo_trading*"]
exclude = ["production*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "archive",
    "production",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
exclude = "^(archive|production|notebooks)/"
